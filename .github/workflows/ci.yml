name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck bootstrap.sh

  # Runs the script the way users do (piped) up to the Azure sign-in, which
  # needs a human; reaching that point means everything before it worked.
  smoke:
    needs: shellcheck
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Run bootstrap (non-interactive)
        run: |
          set +e
          out=$(cat bootstrap.sh | NONINTERACTIVE=1 bash 2>&1)
          echo "$out"
          echo "$out" | grep -q "Not signed in to Azure"
